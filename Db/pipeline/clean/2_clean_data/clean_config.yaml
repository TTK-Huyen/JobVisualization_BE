  ADDITIONAL RULES FOR SKILL EXTRACTION
  Do not extract university majors, academic disciplines, or degree subjects when they appear only as education requirements.
  This rule also applies when majors or disciplines appear in:
  - Bachelor/Master/PhD degree requirements
  - Preferred education background
  - University major lists
  - Academic field descriptions

  Examples:
  - "Bachelor’s degree in Data Science" → do NOT extract Data Science
  - "Degree in Marketing, Economics" → do NOT extract Marketing, Economics
  - "Major in Computer Science" → do NOT extract Computer Science

  Only extract them if they are explicitly required as practical/professional competencies, hands-on experience, or technical expertise outside the education context.

  Examples:
  - "Bachelor’s degree in Computer Science" → do NOT extract Computer Science
  - "Degree in Marketing or Economics" → do NOT extract Marketing or Economics
  - "Major in Data Science" → do NOT extract Data Science

  Only extract them if they are explicitly required as professional competencies, technical skills, domain expertise, or practical experience.

  1) Extract only competencies that a candidate can possess, learn, or be evaluated on.

  Prioritize technical and normalizable skills.

  Skill types:
  - Specialized skill: technologies, programming languages, tools, platforms, frameworks, databases, cloud services, APIs, architectures, methodologies, domain systems, modules, workflows, technical processes.
  - Certification: named certificates, certification codes, or official certification names.
  - Common skill: soft skills, language skills, analytical/communication/problem-solving skills. Extract only when explicitly required and important for the role.

  Prefer Specialized skill and Certification over Common skill.
  Prefer concrete technologies, tools, platforms, frameworks, modules, and named systems over broad category labels.
  If specific named tools/platforms are already extracted, avoid extracting their generic parent category unless the parent category itself is independently required.

  Examples:
  - "Power BI, Tableau" → do NOT additionally extract "BI Tools"
  - "Metric, YouNet ECI" → do NOT additionally extract "E-commerce data platforms"
  - "AWS, Azure, GCP" → do NOT additionally extract "Cloud Platforms"
  - "Docker, Kubernetes" → do NOT additionally extract "Container Technologies"


  If specific tools/platforms are explicitly listed, avoid additionally extracting their generic parent category unless the parent category itself is independently meaningful for recruitment or matching.

  Do not over-extract generic Common skills.

  Do not extract generic personality traits or low-value soft skills such as:
  careful, meticulous, hardworking, dynamic, responsible, work under pressure, eager to learn, honest, friendly.
  Do not extract vague behavioral traits, mindset descriptions, attitudes, personality traits, or organizational values.

  Examples:
  - ownership
  - reliability
  - market awareness
  - proactive attitude
  - customer-oriented mindset
  - passion for technology

  Soft skills should only be extracted when they are explicit, standardized, and useful for job matching.
  Examples:
  - English Communication
  - Problem Solving
  - Analytical Thinking
  - Requirements Gathering

  Do NOT extract abstract organizational competencies, collaboration labels, mindset statements, or business-value phrases unless they represent a standard professional skill commonly used in recruitment normalization.

  Do NOT extract:
  - Cross-Functional Collaboration
  - Structured Thinking
  - Market Awareness
  - Ownership
  - Reliability
  - Customer-centric mindset
  - Passion for technology
  - Adaptability
  - Proactive attitude

  Prefer standardized and directly measurable skills only.
  2) Do NOT extract:
  - degrees, majors, education fields
  - years of experience or tenure requirements
  - job duties/responsibilities unless phrased as required competencies
  - artifacts, outcomes, or environments such as reports, dashboards, solutions, products, production environments
  - generic certification categories without a specific certification name or code
  - generic personality traits or vague soft skills unless explicitly required and useful for matching, such as Communication, Analytical Thinking, Problem Solving, English Communication.

  3) Extract atomic skills.
  If a requirement lists multiple tools, modules, workflows, or skills using commas, slashes, parentheses, “and/or”, or after a dash, extract each meaningful item separately.

  4) Evidence rule:
  For every skill, `evidence_text` must be copied verbatim from JOB POSTING CONTENT.
  If no direct evidence exists, do not extract the skill.
  Do not infer technical specializations from generic verbs such as:
  developing models, building systems, working on projects, implementing solutions.

  Only extract a specialized skill if the technical concept is explicitly mentioned.
  Examples:
  - "data modeling" → extract Data Modeling
  - "building models" → do NOT extract Data Modeling

  If a technical concept is directly and explicitly described in natural language, extract its standard technical name.
  Examples:
  - "query relational databases" → Relational Databases
  - "build dashboards" → Dashboard Development
  - "process streaming data" → Stream Processing


  5) Optional `skill_type`:
  If supported, include one of:
  hard_skill, soft_skill, tool, platform, methodology, domain_knowledge, certification.

  6) Final instruction:
  Output ONLY the single JSON object that matches the schema above.
  If unsure whether a phrase is a skill, prefer NOT to extract it.

  JOB POSTING CONTENT:
  {requirements_text}




