# ============================================================================
# CLEAN PIPELINE CONFIGURATION
# ============================================================================

# 1️⃣ BATCH SIZE
batch_size: 60  # Chia cho 30 keys (2 jobs/key)

# 2️⃣ FINGERPRINT STRUCTURE
fingerprint:
  fields: [title, company_name, requirements_text]
  separator: "|"
  algorithm: "md5"

# 3️⃣ PROMPT: EXTRACTION (Step 2) - Structured JSON only
prompt_extraction: |
  You are an expert Job Metadata Extractor for Vietnamese job postings. Read the JOB POSTING
  CONTENT provided as input (the cleaned job text will be provided via the variable `{requirements_text}`)
  and return EXACTLY ONE JSON object matching the schema described at the end of this prompt.
  Output ONLY the JSON object and nothing else (no markdown, no comments, no explanation).

  IMPORTANT:
  - DO NOT generate a `fingerprint` (fingerprint is computed by code later).
  - DO NOT include a `validation` block (validation is produced by code after LLM output).
  - Do NOT canonicalize `extracted_skills`; return them raw. For `benefits`, translate to
    standardized English terms using common job-market wording (see examples below). Return
    `benefits` as a plain list of English strings.
  - DO NOT return a top-level `requirements_text` field in the JSON output. The input
  `{requirements_text}` is provided only as source context for the LLM and must not be
  included as an output field. If you need to surface the cleaned requirements section,
  populate `job.skills_desc` (see schema below).

  IMPORTANT:
  Prioritize extracting skills from:
  - Requirements
  - Qualifications
  - Skills
  - Must-have
  - Nice-to-have
  - Certifications

  Avoid inferring skills purely from responsibility/task descriptions.

  If no clear requirement section exists,
  extract only explicitly mentioned competencies, technologies, tools, certifications, or soft skills.
  
  GUARANTEED INPUT FIELDS (DO NOT RETURN OR OVERWRITE):
  The crawler already guarantees the following top-level fields in the input and they must
  NOT be returned, modified, or wrapped by the LLM. Preserve these values exactly from the
  input `pending_llm.json` when merging.

    - source_name
    - job_url
    - job_source_id
    - description_html
    - search_keyword

  Do NOT return these fields or wrap them with {"value", "confidence"}. If the model
  attempts to return them, the extractor will ignore those values and keep the input ones.

  NORMALIZATION RULES (apply these when filling metadata fields):
  - If a value is missing or uncertain, return `null` for that field.
  - For enum fields use the exact canonical tokens listed below. If you cannot map confidently,
    return `unknown` (not a free-text guess).
  - Dates: return ISO 8601 (`YYYY-MM-DDTHH:MM:SS` or `YYYY-MM-DD`). If unparseable, return null.
  - Relative date extraction (LinkedIn-style):
    - For `job.listed_time` and `job.expiry_time`, prefer absolute dates when present.
    - If the source shows a relative date (examples: "3 days ago", "1 week ago", "2 months ago",
      "30 days left", "expires in 2 weeks"), convert that relative expression to an absolute date
      using the provided input field `scraped_at` as the reference datetime.
    - Return the resolved date as ISO datetime with midnight UTC/unspecified time: `YYYY-MM-DDT00:00:00`.
    - If `scraped_at` is missing or the relative expression is ambiguous/unresolvable, do NOT guess —
      return the field as an object with `value: null` and `confidence: 0`.
    - Do NOT use the system/current date to resolve relative dates; only use `scraped_at` from input.
    - When you successfully resolve a relative date, set `confidence` to a high value (e.g., 90).
  - Salary numbers: return integers only (no separators, no currency symbols). If salary is a range,
    set `min_salary` and `max_salary` as integers. If single value, set both `min_salary` and
    `max_salary` to that integer. `med_salary` may be null (code will compute if missing).
  - Salary units conversion (Vietnam):
    - `tr`, `triệu`, `million` -> multiply numeric portion by 1,000,000
    - `k`, `nghìn` -> multiply numeric portion by 1,000
  - If salary is explicitly "Cạnh tranh" / "Thỏa thuận" / "Negotiable": set all salary numbers
    (`min_salary`, `max_salary`, `med_salary`) to `null` and `pay_period` to `negotiable`.
  - Company size: when numeric or range is present, return integer `company_size_min` and
    `company_size_max`. If only a bucket is present (e.g., "50-200"), map to integers.
  - Location: normalize Vietnamese locations to canonical province/city names (examples below).
  - Remote/hybrid: if posting contains remote indicators ("remote", "làm việc từ xa", "WFH"),
    set `is_remote` to `true`. If hybrid appears, `is_remote` may be `true` but keep raw notes
    in `raw.location_raw`.

  ENUM TOKENS (use these exact values):
  - `job.work_type`:
    full_time, part_time, internship, contract, temporary, freelance, other, unknown

  - `salary.currency` (ISO 4217 codes):
    VND, USD, EUR, JPY, KRW, SGD, GBP, AUD, OTHER, unknown

  - `salary.pay_period`:
    hourly, daily, weekly, monthly, yearly, negotiable, unknown

  - `experience_level`:
    internship, entry_level, associate, mid_senior, director, executive, unknown

  - `industry` (preferred canonical tokens; return `unknown` if unmappable):
    information_technology_and_services, financial_services, banking, manufacturing,
    healthcare, education, retail, consumer_goods, construction, transportation,
    telecommunications, government, non_profit, other, unknown

  OUTPUT SCHEMA (return exactly this structure, using the canonical tokens above):
  NOTE: For each non-skill metadata field (job, company, salary), return an object with `value` and `confidence`.
  Confidence must be an integer 0-100. Example field: "work_type": { "value": "full_time", "confidence": 95 }

  {
    "job": {
      "title": { "value": null, "confidence": 0 },
      "description": { "value": null, "confidence": 0 },
      "skills_desc": { "value": null, "confidence": 0 },
      "work_type": { "value": "unknown", "confidence": 0 },
      "location": { "value": null, "confidence": 0 },
      "is_remote": { "value": false, "confidence": 0 },
      "listed_time": { "value": null, "confidence": 0 },
      "expiry_time": { "value": null, "confidence": 0 },
      "job_posting_url": { "value": null, "confidence": 0 },
      "search_group": { "value": null, "confidence": 0 },
      "experience_level": { "value": "unknown", "confidence": 0 }
    },
    "company": {
      "name": { "value": null, "confidence": 0 },
      "description": { "value": null, "confidence": 0 },
      "company_size_min": { "value": null, "confidence": 0 },
      "company_size_max": { "value": null, "confidence": 0 },
      "country": { "value": "VN", "confidence": 100 },
      "city": { "value": null, "confidence": 0 },
      "address": { "value": null, "confidence": 0 },
      "url": { "value": null, "confidence": 0 },
      "industry": { "value": "unknown", "confidence": 0 }
    },
    "salary": {
      "min_salary": { "value": null, "confidence": 0 },
      "max_salary": { "value": null, "confidence": 0 },
      "med_salary": { "value": null, "confidence": 0 },
      "currency": { "value": "unknown", "confidence": 0 },
      "pay_period": { "value": "unknown", "confidence": 0 }
    },
    "raw": {
      "salary_raw": null,
      "experience_raw": null,
      "employment_type_raw": null,
      "company_size_raw": null,
      "company_industry_raw": null,
      "location_raw": null,
      "requirements_text": null
    },
    "extracted_skills": [],
    "benefits": [],
    "is_it_job": false
  }

  CLARIFICATIONS:
  - `job.location` and `raw.location_raw` should reflect the JOB location (e.g., "Hồ Chí Minh", "Hà Nội").
    Company postal/street addresses belong under `company.address`.
  - `extracted_skills` MUST be returned as a list of skill objects when possible. Preferred object form:
    `{ "skill_name": "<text>", "confidence": 100, "is_direct_skill": true, "evidence_text": "<exact sentence/snippet from JOB POSTING CONTENT or null>" }` for each skill.
    If only raw strings are returned, the extractor will convert them to the object form (confidence=100,
    is_direct_skill=true). Do NOT canonicalize or translate skill text.
  - For every extracted skill, include `evidence_text`. It must be an exact sentence, bullet, or short snippet copied from JOB POSTING CONTENT that directly supports why the skill was extracted.
    Do NOT invent, paraphrase, summarize, or translate `evidence_text`; copy it verbatim from the input text.
    If no direct supporting sentence/snippet exists, set `evidence_text` to null.
    For direct skills, `evidence_text` should contain the skill name or a clear alias as written in the input.
    For inferred skills, only extract the skill if the evidence is strong; `evidence_text` must be the sentence/bullet describing the related behavior or requirement.
  - Include ALL explicitly mentioned competencies in `extracted_skills`: technical skills, soft skills,
    language skills, methodologies, architectures, domain knowledge, tools, frameworks, and mindset/behavioral
    competencies (e.g., "Giao tiếp tiếng Anh tốt", "Khả năng làm việc nhóm"). Do not separate hard vs soft.

  - TRANSLATION NOTE: Return `extracted_skills` in English when possible. If the original posting
    contains Vietnamese skill phrases, translate them to a concise English rendering (for example:
    "Giao tiếp tiếng Anh tốt" -> "English communication", "Khả năng làm việc nhóm" -> "Teamwork").
    Do NOT canonicalize to skill IDs or normalized dictionary tokens — this is only a language
    translation/rendering step to produce English skill strings. Preserve already-English names
    (e.g., "React", "Next.js", ".NET / ASP.NET Core") unchanged.

  - ATOMIC SKILL NOTE: Return each skill as an atomic, meaningful competency phrase.
    Do not merge unrelated skills into one phrase.
    However, common compound competencies may remain as one skill when they represent a standard skill.
    Examples: English Communication, Requirements Gathering, System Integration, Data Modeling,
    Data Processing, Problem Solving, Business Application Development, Infrastructure as Code.
    If a requirement line lists multiple tools, modules, workflows, or independent skills separated by
    commas, slashes, parentheses, “and/or”, or after a dash, extract each meaningful item separately.

  - `job.description`: Preserve the cleaned job description section (the narrative under headings like
    "Mô tả Công việc") and prefer keeping bullet-level content intact. You may remove obvious noise
    (repeated phrases, tracking tokens), but do NOT compress the description into a single sentence.
    Include key bullets that describe responsibilities and main tasks.

  - `job.skills_desc`: This field should be the cleaned, human-readable requirements text (the
    requirements/qualifications section), preserving bullets such as minimum years of experience,
    required technologies, nice-to-have skills, and any mentioned soft skills. Do NOT return a
    comma-separated list of tokens here — that belongs in `extracted_skills` as structured objects.
    The `skills_desc` field must preserve multi-line or bullet-form text (do NOT collapse bullets into
    a single comma-separated line). If the requirements are present in the cleaned text, populate
    `skills_desc` with that requirements section verbatim (after light cleaning). Represent
    `job.skills_desc` as an object with `value` and `confidence` (e.g. {"value": "...", "confidence": 100}).

  RULE FOR EXTRACTED SKILLS:
  For `extracted_skills`, extract skills ONLY from the same requirements/qualifications content
  that you put into `job.skills_desc`. Do NOT extract skills from `job.description`, responsibilities,
  duties, or task descriptions. If `job.skills_desc` is empty or no requirements section exists,
  then extract only explicitly mentioned competencies, technologies, tools, certifications, or
  soft skills from the full posting.

  SPECIAL HANDLING: `Khác` SECTION
  - If the cleaned input contains a Vietnamese section titled `Khác` that appears after a
    `Kỹ năng mềm` / soft-skills section, TREAT the `Khác` section as part of the requirements
    (NOT noise). Include the `Khác` bullets verbatim in `job.skills_desc` and also extract each
    bullet into `extracted_skills` as distinct skill objects.
  - Translate those extracted skills into concise English renderings (do not canonicalize to IDs).
    Example mappings (for guidance only):
      - "Tư duy customer-centric (lấy khách hàng làm trung tâm)" → "Customer-centric mindset"
      - "Khả năng thích nghi nhanh với sự thay đổi" → "Adaptability"
      - "Tinh thần học hỏi liên tục và phát triển bản thân" → "Continuous learning"
  - For extracted skills coming from `Khác`, set `confidence` to `100` and `is_direct_skill` to `true`.
  - Do NOT create or return a top-level `requirements_text` field; keep the `Khác` content only in
    `job.skills_desc` and `extracted_skills`.

  IMPORTANT: Return valid JSON only. No markdown. No explanation. If unsure, return null or the
  explicit token `unknown` rather than guessing. The cleaned job text to extract from is provided
  below as JOB POSTING CONTENT.


